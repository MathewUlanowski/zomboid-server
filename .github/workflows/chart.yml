# Lints the Helm chart on every change and, on main, publishes it to
# oci://ghcr.io/<owner>/charts at the version in Chart.yaml.
name: Helm chart

on:
  push:
    branches: [main]
    paths:
      - charts/**
      - .github/workflows/chart.yml
  pull_request:
    paths:
      - charts/**
      - .github/workflows/chart.yml
  workflow_dispatch:

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint
        run: |
          helm lint charts/zomboid
          helm template test charts/zomboid > /dev/null
          helm template test charts/zomboid \
            --set mods.workshopIds[0]=2544353492 \
            --set backup.enabled=true \
            --set service.rcon.enabled=true > /dev/null

      - name: Package
        if: github.event_name != 'pull_request'
        run: helm package charts/zomboid --destination dist

      - name: Push to ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          helm push dist/*.tgz "oci://ghcr.io/${owner}/charts"
