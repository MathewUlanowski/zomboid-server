{{- if not .Values.auth.existingSecret }}
{{- /*
Admin password: an explicit value wins; otherwise reuse what is already
deployed (so upgrades never rotate it); otherwise generate one on first
install. `lookup` returns nothing under `helm template` / client dry-runs, so
those always show a fresh random value.
*/}}
{{- $adminPassword := .Values.auth.adminPassword | toString }}
{{- if not $adminPassword }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "zomboid.fullname" .) }}
{{- if and $existing $existing.data (index $existing.data "admin-password") }}
{{- $adminPassword = index $existing.data "admin-password" | b64dec }}
{{- else }}
{{- $adminPassword = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zomboid.fullname" . }}
  labels:
    {{- include "zomboid.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $adminPassword | b64enc | quote }}
  server-password: {{ .Values.auth.serverPassword | toString | b64enc | quote }}
  rcon-password: {{ .Values.auth.rconPassword | toString | b64enc | quote }}
{{- end }}
