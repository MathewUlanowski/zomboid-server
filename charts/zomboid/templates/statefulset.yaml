apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zomboid.fullname" . }}
  labels:
    {{- include "zomboid.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "zomboid.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "zomboid.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zomboid.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: zomboid
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: PZ_SERVER_NAME
              value: {{ .Values.server.name | quote }}
            - name: PZ_PUBLIC_NAME
              value: {{ .Values.server.publicName | quote }}
            - name: PZ_MAX_PLAYERS
              value: {{ .Values.server.maxPlayers | quote }}
            - name: PZ_MEMORY
              value: {{ .Values.server.memory | quote }}
            - name: PZ_VERSION
              value: {{ .Values.server.version | quote }}
            - name: PZ_VALIDATE_ON_START
              value: {{ .Values.server.validateOnStart | quote }}
            - name: PZ_BETA_BRANCH
              value: {{ .Values.server.betaBranch | quote }}
            - name: PZ_ADMIN_USERNAME
              value: {{ .Values.server.adminUsername | quote }}
            - name: PZ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zomboid.secretName" . }}
                  key: admin-password
            - name: PZ_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zomboid.secretName" . }}
                  key: server-password
                  optional: true
            - name: PZ_RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zomboid.secretName" . }}
                  key: rcon-password
                  optional: true
            - name: PZ_PORT
              value: {{ .Values.service.gamePort | quote }}
            - name: PZ_UDP_PORT
              value: {{ .Values.service.udpPort | quote }}
            - name: PZ_RCON_PORT
              value: {{ .Values.service.rcon.port | quote }}
            - name: PZ_MANAGE_MODS
              value: {{ .Values.mods.manage | quote }}
            - name: PZ_WORKSHOP_IDS
              value: {{ include "zomboid.workshopIds" . | quote }}
            - name: PZ_MOD_IDS
              value: {{ join ";" .Values.mods.modIds | quote }}
            - name: PZ_MOD_IDS_EXCLUDE
              value: {{ join ";" .Values.mods.excludeModIds | quote }}
            - name: PZ_RESOLVE_DEPENDENCIES
              value: {{ .Values.mods.resolveDependencies | quote }}
            - name: PZ_MAPS
              value: {{ join ";" .Values.mods.maps | quote }}
            - name: PZ_INI_OVERRIDES
              value: {{ include "zomboid.iniOverrides" . | quote }}
            - name: PZ_SANDBOX_OVERRIDES
              value: {{ include "zomboid.sandboxOverrides" . | quote }}
            - name: PZ_EXTRA_ARGS
              value: {{ .Values.server.extraArgs | quote }}
          ports:
            - name: game
              containerPort: {{ .Values.service.gamePort }}
              protocol: UDP
            - name: direct
              containerPort: {{ .Values.service.udpPort }}
              protocol: UDP
            {{- if .Values.service.rcon.enabled }}
            - name: rcon
              containerPort: {{ .Values.service.rcon.port }}
              protocol: TCP
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /home/steam/pz
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
      {{- else if not .Values.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
